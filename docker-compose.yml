# Sobe só o Postgres local, pra rodar o backend/Prisma sem depender do
# Supabase durante o desenvolvimento. O Supabase Storage continua sendo
# usado pra guardar os PDFs (ver README) — é independente do banco.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stakeholder
      POSTGRES_PASSWORD: stakeholder
      POSTGRES_DB: stakeholder_virtual
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
